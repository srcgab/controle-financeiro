<header class="app-header">
  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <div class="header-container">
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Header Content -->
    <div class="header-content">
      <button *ngIf="showBackButton" class="btn-back" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Voltar
      </button>
      <div class="title-section">
        <h1 class="header-title">{{ title }}</h1>
        <p *ngIf="subtitle" class="header-subtitle">{{ subtitle }}</p>
      </div>
    </div>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/home" class="nav-link" [class.active]="isActiveRoute('/home')">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9,22 9,12 15,12 15,22"></polyline>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/transactions" class="nav-link" [class.active]="isActiveRoute('/transactions')">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="m17 5-5 5-5-5"></path>
              <path d="m17 19-5-5-5 5"></path>
            </svg>
            <span>Transações</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/add-income" class="nav-link" [class.active]="isActiveRoute('/add-income')">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Nova Receita</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/add-expense" class="nav-link" [class.active]="isActiveRoute('/add-expense')">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Nova Despesa</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/developers" class="nav-link" [class.active]="isActiveRoute('/developers')">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16,18 22,12 16,6"></polyline>
              <polyline points="8,6 2,12 8,18"></polyline>
            </svg>
            <span>Desenvolvedores</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- User Menu -->
    <div class="user-menu">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
      </div>
      <div class="user-actions">
        <button class="btn-profile" (click)="navigateTo('/profile')" title="Perfil">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
        <button class="btn-logout" (click)="logout()" title="Sair">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16,17 21,12 16,7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Navigation Menu -->
  <nav class="mobile-nav" [class.open]="isMobileMenuOpen">
    <div class="mobile-nav-header">
      <div class="user-info-mobile">
        <div class="user-avatar">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-details">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">Usuário</span>
        </div>
      </div>
    </div>

    <ul class="mobile-nav-list">
      <li class="mobile-nav-item">
        <a routerLink="/home" class="mobile-nav-link" [class.active]="isActiveRoute('/home')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9,22 9,12 15,12 15,22"></polyline>
          </svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/transactions" class="mobile-nav-link" [class.active]="isActiveRoute('/transactions')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="m17 5-5 5-5-5"></path>
            <path d="m17 19-5-5-5 5"></path>
          </svg>
          <span>Transações</span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/add-income" class="mobile-nav-link" [class.active]="isActiveRoute('/add-income')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Nova Receita</span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/add-expense" class="mobile-nav-link" [class.active]="isActiveRoute('/add-expense')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Nova Despesa</span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/profile" class="mobile-nav-link" [class.active]="isActiveRoute('/profile')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Perfil</span>
        </a>
      </li>

      <li class="mobile-nav-item">
        <a routerLink="/developers" class="mobile-nav-link" [class.active]="isActiveRoute('/developers')" (click)="closeMobileMenu()">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16,18 22,12 16,6"></polyline>
            <polyline points="8,6 2,12 8,18"></polyline>
          </svg>
          <span>Desenvolvedores</span>
        </a>
      </li>
    </ul>

    <div class="mobile-nav-footer">
      <button class="mobile-logout-btn" (click)="logout()">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16,17 21,12 16,7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </nav>
</header>
