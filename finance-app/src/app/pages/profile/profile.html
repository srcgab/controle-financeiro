<div class="profile-container">
  <header class="profile-header">
    <div class="header-content">
      <button class="btn-back" (click)="goBack()">
        ← Voltar
      </button>
      <h1>Meu Perfil</h1>
      <p class="header-subtitle">Gerencie suas informações pessoais</p>
    </div>
    <button class="btn-logout" (click)="logout()">Sair</button>
  </header>

  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
    <p>Atualizando perfil...</p>
  </div>

  <div *ngIf="!isLoading" class="profile-content">
    <div class="profile-card">
      <div class="profile-photo-section">
        <div class="photo-container">
          <img 
            [src]="userPhoto" 
            [alt]="userName"
            class="profile-photo">
          <div class="photo-overlay" *ngIf="isEditing">
            <label for="photoInput" class="photo-upload-label">
              Alterar Foto
              <input 
                type="file" 
                id="photoInput"
                accept="image/*"
                (change)="onFileSelected($event)"
                class="photo-input"
                hidden>
            </label>
          </div>
        </div>
        <div class="photo-info" *ngIf="isEditing">
          <p class="photo-hint">JPG, PNG ou GIF (máx. 2MB)</p>
        </div>
      </div>

      <div class="profile-info-section">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
          <div class="form-group">
            <label for="name" class="form-label">
              Nome Completo
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="name"
              formControlName="name"
              class="form-input"
              [class.input-error]="isNameInvalid"
              [readonly]="!isEditing"
              placeholder="Digite seu nome completo">
            <div *ngIf="isNameInvalid" class="error-message">
              <span *ngIf="nameControl?.errors?.['required']">
                Nome é obrigatório
              </span>
              <span *ngIf="nameControl?.errors?.['minlength']">
                Nome deve ter no mínimo 3 caracteres
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">
              E-mail
            </label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-input input-disabled"
              readonly
              placeholder="seu@email.com">
            <p class="field-hint">O e-mail não pode ser alterado</p>
          </div>

          <div *ngIf="feedback" 
               class="feedback-message" 
               [class.feedback-success]="feedbackType === 'success'"
               [class.feedback-error]="feedbackType === 'error'">
            {{ feedback }}
          </div>

          <div class="form-actions">
            <button 
              type="button" 
              class="btn btn-secondary"
              *ngIf="!isEditing"
              (click)="toggleEdit()">
              Editar Perfil
            </button>
            
            <div class="edit-actions" *ngIf="isEditing">
              <button 
                type="button" 
                class="btn btn-cancel"
                (click)="toggleEdit()">
                Cancelar
              </button>
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="profileForm.invalid || isLoading">
                Salvar Alterações
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="profile-stats">
      <h2>Informações da Conta</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Membro desde</span>
          <span class="stat-value">
            
          </span>
        </div>
        <div class="stat-item">
          <span class="stat-label">ID do Usuário</span>
          <span class="stat-value">#{{ currentUser?.id || 'N/A' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
